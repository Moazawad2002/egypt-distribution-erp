services:
  postgres:
    image: postgres:16-alpine
    container_name: egypt_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: egypt_distribution_erp
      TZ: Africa/Cairo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: egypt_erp_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/egypt_distribution_erp?schema=public
      JWT_SECRET: supersecretproductionjwtkeyegyptdistribution2026!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: supersecretrefreshkeyegyptdistribution2026!
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
